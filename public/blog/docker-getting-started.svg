<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Docker 入门文章封面</title>
  <desc id="desc">深蓝背景上排列着代表 Docker 镜像层和容器的几何图形</desc>
  <defs>
    <linearGradient id="background" x1="80" y1="40" x2="1120" y2="590" gradientUnits="userSpaceOnUse">
      <stop stop-color="#081426"/>
      <stop offset="1" stop-color="#123E75"/>
    </linearGradient>
    <linearGradient id="container" x1="735" y1="145" x2="1010" y2="505" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4CB4FF"/>
      <stop offset="1" stop-color="#1769E0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" rx="28" fill="url(#background)"/>
  <circle cx="1070" cy="92" r="184" fill="#209BFF" opacity="0.1"/>
  <circle cx="1090" cy="590" r="255" fill="#42CCFF" opacity="0.08"/>

  <g fill="none" stroke="#6AC7FF" stroke-opacity="0.13">
    <path d="M0 126H1200M0 252H1200M0 378H1200M0 504H1200"/>
    <path d="M150 0V630M300 0V630M450 0V630M600 0V630M750 0V630M900 0V630M1050 0V630"/>
  </g>

  <g transform="translate(92 112)">
    <rect width="132" height="34" rx="17" fill="#1D8CFF"/>
    <text x="66" y="23" fill="#EAF7FF" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="700" text-anchor="middle" letter-spacing="1.5">GET STARTED</text>
    <text x="0" y="121" fill="#FFFFFF" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="70" font-weight="750" letter-spacing="-3">Docker 入门</text>
    <text x="2" y="178" fill="#A9D8FF" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="28">概念 · 命令 · 镜像 · Compose</text>

    <g transform="translate(0 248)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">
      <rect width="478" height="72" rx="14" fill="#071120" stroke="#25517F"/>
      <circle cx="31" cy="36" r="6" fill="#49C7FF"/>
      <text x="54" y="43" fill="#D9EFFF">docker run -p 8080:80 nginx</text>
